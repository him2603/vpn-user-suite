# /etc/nginx/conf.d/vpn-portal-agent.conf
#
# TLS terminator in front of the agent. The agent itself only listens on
# 127.0.0.1, so this is the single, encrypted entry point.

server {
    listen 443 ssl;
    http2 on;
    server_name vpn-agent.example.com;   # <-- change me

    ssl_certificate     /etc/pki/tls/certs/vpn-agent.crt;
    ssl_certificate_key /etc/pki/tls/private/vpn-agent.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    server_tokens off;

    client_max_body_size 16k;

    # Only the portal's API surface is reachable.
    location ~ ^/(v1/|healthz$) {
        limit_except POST GET { deny all; }
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 20s;
    }

    location / {
        return 404;
    }
}

server {
    listen 80;
    server_name vpn-agent.example.com;   # <-- change me
    return 301 https://$host$request_uri;
}
